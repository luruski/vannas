AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "db/schema.rb"
    - "db/migrate/**/*"
    - "bin/**/*"
    - "config/**/*"
    - "Gemfile"
    - "Rakefile"
    - "node_modules/**/*"
    - "vendor/**/*"
    - "test/**/*"
    - "app/admin/**/*"

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/OneClassPerFile:
  Enabled: false

Metrics/MethodLength:
  Max: 55

Metrics/AbcSize:
  Max: 50

Metrics/ClassLength:
  Max: 125

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 10

Metrics/BlockLength:
  Enabled: false

Layout/LineLength:
  Max: 150